name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, redis, mbstring, xml, ctype, json, gd
          coverage: none

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: Setup Environment
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate
        env:
          APP_KEY: base64:test-key-for-ci
          JWT_SECRET: test-jwt-secret-for-ci-min-32-chars-long
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_BUCKET: test

      - name: Run Migrations
        run: |
          cd backend
          php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run PHPUnit Tests
        run: |
          cd backend
          composer test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run Pint (Code Style)
        run: |
          cd backend
          composer lint

      - name: Run PHPStan (Static Analysis)
        run: |
          cd backend
          composer phpstan
        continue-on-error: true

  frontend:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npm run typecheck

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Run Tests (if available)
        run: |
          cd frontend
          npm run test || echo "Tests not configured yet"
        continue-on-error: true

  docker-build:
    name: Docker Build (Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: pdo-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: pdo-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, redis, mbstring, xml, ctype, json, gd

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: Setup Environment
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate
        env:
          APP_KEY: base64:test-key-for-ci
          JWT_SECRET: test-jwt-secret-for-ci-min-32-chars-long
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_BUCKET: test

      - name: Run Migrations
        run: |
          cd backend
          php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run Seeders
        run: |
          cd backend
          php artisan db:seed --class=TenantSeeder || echo "Seeder skipped"
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Start Laravel Server
        run: |
          cd backend
          php artisan serve --host=0.0.0.0 --port=8000 &
          sleep 5
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Check Health Endpoint
        run: |
          curl -f http://localhost:8000/api/health || exit 1
          echo "Health check passed"
