version: '3.9'

services:
  nginx:
    extends:
      file: ./infra/docker-compose.yml
      service: nginx

  php-fpm:
    extends:
      file: ./infra/docker-compose.yml
      service: php-fpm

  queue-worker:
    extends:
      file: ./infra/docker-compose.yml
      service: queue-worker

  postgres:
    extends:
      file: ./infra/docker-compose.yml
      service: postgres

  redis:
    extends:
      file: ./infra/docker-compose.yml
      service: redis

  minio:
    extends:
      file: ./infra/docker-compose.yml
      service: minio

  ws:
    extends:
      file: ./infra/docker-compose.yml
      service: ws

  frontend:
    extends:
      file: ./infra/docker-compose.yml
      service: frontend

  # Monitoring Services (dev profile)
  prometheus:
    image: prom/prometheus:latest
    container_name: pdo_prometheus
    restart: unless-stopped
    profiles: ["dev", "monitoring"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - pdo_network
    depends_on:
      - nginx

  grafana:
    image: grafana/grafana:latest
    container_name: pdo_grafana
    restart: unless-stopped
    profiles: ["dev", "monitoring"]
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - pdo_network
    depends_on:
      - prometheus

  # K6 Load Testing Services
  k6-smoke:
    image: grafana/k6:latest
    container_name: pdo_k6_smoke
    profiles: ["loadtest"]
    volumes:
      - ./loadtest/k6:/scripts
      - ./loadtest/results:/results
    working_dir: /scripts
    command: run --out json=/results/smoke.json smoke.js
    environment:
      - BASE_URL=${BASE_URL:-http://nginx:80}
      - EMAIL=${TEST_EMAIL:-admin@college.edu}
      - PASSWORD=${TEST_PASSWORD:-Password123!}
    networks:
      - pdo_network
    depends_on:
      - nginx

  k6-schedule:
    image: grafana/k6:latest
    container_name: pdo_k6_schedule
    profiles: ["loadtest"]
    volumes:
      - ./loadtest/k6:/scripts
      - ./loadtest/results:/results
    working_dir: /scripts
    command: run --out json=/results/schedule.json schedule.js
    environment:
      - BASE_URL=${BASE_URL:-http://nginx:80}
      - EMAIL=${TEST_EMAIL:-scheduler@college.edu}
      - PASSWORD=${TEST_PASSWORD:-Password123!}
    networks:
      - pdo_network
    depends_on:
      - nginx

  k6-chat:
    image: grafana/k6:latest
    container_name: pdo_k6_chat
    profiles: ["loadtest"]
    volumes:
      - ./loadtest/k6:/scripts
      - ./loadtest/results:/results
    working_dir: /scripts
    command: run --out json=/results/chat.json chat.js
    environment:
      - BASE_URL=${BASE_URL:-http://nginx:80}
      - EMAIL=${TEST_EMAIL:-student1@college.edu}
      - PASSWORD=${TEST_PASSWORD:-Password123!}
    networks:
      - pdo_network
    depends_on:
      - nginx

  k6-assignments:
    image: grafana/k6:latest
    container_name: pdo_k6_assignments
    profiles: ["loadtest"]
    volumes:
      - ./loadtest/k6:/scripts
      - ./loadtest/results:/results
    working_dir: /scripts
    command: run --out json=/results/assignments.json assignments.js
    environment:
      - BASE_URL=${BASE_URL:-http://nginx:80}
      - EMAIL=${TEST_EMAIL:-student1@college.edu}
      - PASSWORD=${TEST_PASSWORD:-Password123!}
    networks:
      - pdo_network
    depends_on:
      - nginx

  k6-documents:
    image: grafana/k6:latest
    container_name: pdo_k6_documents
    profiles: ["loadtest"]
    volumes:
      - ./loadtest/k6:/scripts
      - ./loadtest/results:/results
    working_dir: /scripts
    command: run --out json=/results/documents.json documents.js
    environment:
      - BASE_URL=${BASE_URL:-http://nginx:80}
      - EMAIL=${TEST_EMAIL:-admin@college.edu}
      - PASSWORD=${TEST_PASSWORD:-Password123!}
    networks:
      - pdo_network
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  pdo_network:
    driver: bridge