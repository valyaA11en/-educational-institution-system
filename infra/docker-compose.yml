version: '3.9'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: pdo_nginx
    restart: unless-stopped
    depends_on:
      - php-fpm
      - frontend
      - ws
    env_file:
      - ../.env
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ../backend:/var/www/html:ro
      - ../frontend:/var/www/frontend:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pdo_network

  php-fpm:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: pdo_php_fpm
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ../.env
    volumes:
      - ../backend:/var/www/html
    networks:
      - pdo_network

  queue-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: pdo_queue_worker
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ../.env
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - php-fpm
      - redis
    networks:
      - pdo_network

  postgres:
    image: postgres:16-alpine
    container_name: pdo_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pdo_network

  redis:
    image: redis:7-alpine
    container_name: pdo_redis
    restart: unless-stopped
    env_file:
      - ../.env
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - pdo_network

  minio:
    image: minio/minio:latest
    container_name: pdo_minio
    restart: unless-stopped
    env_file:
      - ../.env
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - pdo_network

  ws:
    build:
      context: ../websocket
      dockerfile: Dockerfile
    container_name: pdo_ws
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - pdo_network

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    container_name: pdo_frontend
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ../.env
    environment:
      VITE_API_URL: ${VITE_API_URL-http://localhost:8000/api}
      VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL-ws://localhost:8000/ws}
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - pdo_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  pdo_network:
    driver: bridge


