global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'pdo-dev'
    environment: 'development'

scrape_configs:
  - job_name: 'pdo-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: 'pdo-api'
          instance: 'pdo-backend'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

